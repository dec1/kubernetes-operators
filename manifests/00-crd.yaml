# The Widget resource type. Applying it registers the type with the API server;
# only then does it accept Widget objects (01-widget-demo.yaml).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.example.com   # <plural>.<group>
spec:
  group: example.com
  scope: Namespaced
  names:
    plural: widgets
    singular: widget
    kind: Widget
  versions:
    - name: v1
      served: true
      storage: true
      # status is a subresource: the operator writes it only through
      # .../widgets/{name}/status, and writes to the object itself leave it unchanged.
      subresources:
        status: {}
      # Columns for `kubectl get widgets`: spec and result side by side.
      additionalPrinterColumns:
        - name: Spec
          type: integer
          jsonPath: .spec.replicas
        - name: Running
          type: integer
          jsonPath: .status.replicas
        - name: Ready
          type: boolean
          jsonPath: .status.ready
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:   # Written by the Client.
              type: object
              required: [replicas]
              properties:
                replicas:
                  type: integer
                  minimum: 0
            status: # The result, written by the operator.
              type: object
              properties:
                replicas:
                  type: integer
                ready:
                  type: boolean
