# Identity and permissions for an operator running in a Pod. Not needed when it
# runs outside the cluster through `kubectl proxy`, which uses your own permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: widget-operator
  namespace: default
---
# Exactly the API calls the operator makes: "LIST" and "WATCH" Widgets, PATCH their status.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: widget-operator
  namespace: default
rules:
  - apiGroups: [example.com]
    resources: [widgets]
    verbs: [list, watch]
  - apiGroups: [example.com]
    resources: [widgets/status]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: widget-operator
  namespace: default
subjects:
  - kind: ServiceAccount
    name: widget-operator
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: widget-operator
