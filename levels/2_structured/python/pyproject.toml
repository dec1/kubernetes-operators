# Read by uv and pytest. The program has no dependencies; pytest is needed only for the tests.
[project]
name = "control_loop"
version = "0.1.0"
requires-python = ">=3.14"  # Supported versions; .python-version selects the one uv uses here.
dependencies = []

# With a build system, uv installs the control_loop package from src/ into .venv/,
# so the tests and `python -m control_loop...` find it without PYTHONPATH.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Development-only tools. Written by: uv add --dev pytest
[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

# testpaths: where plain `pytest` (and an IDE's folder run) looks for tests.
[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib: test files in different folders may share a name (eg test_store.py).
addopts = ["--import-mode=importlib"]
